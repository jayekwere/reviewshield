name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      
      - run: node --import tsx scripts/schema.ts > /tmp/reviewshield-input.schema.json && cmp schemas/input.schema.json /tmp/reviewshield-input.schema.json
      - run: npm run verify
      - run: mkdir -p artifacts && node dist/src/main.js demo > artifacts/output.json && cmp samples/output.json artifacts/output.json
      - run: python -m ruff check scanner && python -m mypy --strict scanner
      - run: python -m coverage run --branch --source=scanner --omit='scanner/test_*.py' -m unittest discover -s scanner -p 'test_*.py'
      - run: python -m coverage report --fail-under=80 && python -m coverage xml -o coverage.xml
      - run: python -m venv .scanner && .scanner/bin/python -m pip install --require-hashes -r requirements-scanner.lock
      - run: python scanner/scan.py fixtures artifacts/semgrep.sarif --semgrep .scanner/bin/semgrep
      - run: node --import tsx scripts/verify-scan.ts artifacts/semgrep.sarif
      - run: npm audit --audit-level=high
      - name: Install browser and system dependencies
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-ci-network-timeouts > /dev/null
          npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -f Dockerfile.scanner -t reviewshield-scanner:ci .
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --user 10001:10001 --pids-limit 128
          --memory 1g --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --mount "type=bind,source=${{ github.workspace }}/fixtures,target=/input,readonly"
          reviewshield-scanner:ci > artifacts/worker-verification.json
      - run: node --import tsx scripts/verify-worker.ts artifacts/worker-verification.json
      - run: node --import tsx scripts/verify-coordinator.ts reviewshield-scanner:ci > artifacts/coordinator-verification.json
      - run: docker build -t reviewshield:ci .
      - run: node scripts/container-smoke.mjs reviewshield:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage.xml
            docs/workbench.png
            samples/output.json
            artifacts/
          if-no-files-found: warn
          retention-days: 14
